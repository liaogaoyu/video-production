# 应用登录保护全部 API、媒体、事件流与下载。
# 先初始化 app_users 并启用 STORYDOCK_AUTH_REQUIRED=1，再开放公网。
# 即梦账号池与工作台登录账号相互独立。

server {
  # 默认用于内网或 SSH 隧道验收。公网使用域名和可信 HTTPS 证书。
  listen 80;
  server_name _;
  # ssl_certificate /etc/storydock/tls.crt;
  # ssl_certificate_key /etc/storydock/tls.key;
  client_max_body_size 500m;
  gzip on;
  gzip_types text/css text/javascript application/javascript application/json;

  location /api/v1/events {
    proxy_pass http://127.0.0.1:4320;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $http_host;
  }

  location / {
    proxy_pass http://127.0.0.1:4320;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
