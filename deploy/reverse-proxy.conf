# 入口、页面、接口、媒体、事件流和下载走同一层访问控制。
# 公网部署时取消下面 auth_basic 的注释，或改用现有身份网关。
# 即梦账号池与这层访问密码相互独立。

server {
  # 默认用于内网或 SSH 隧道验收。公网使用域名和可信 HTTPS 证书。
  listen 80;
  server_name _;
  # ssl_certificate /etc/storydock/tls.crt;
  # ssl_certificate_key /etc/storydock/tls.key;
  client_max_body_size 500m;
  auth_basic "Storydock";
  auth_basic_user_file /etc/storydock/htpasswd;

  location /api/v1/events {
    proxy_pass http://127.0.0.1:4320;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://127.0.0.1:4320;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
